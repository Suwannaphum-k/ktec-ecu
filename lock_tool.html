<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KTEC LOCK TOOL</title>
<style>
body{margin:0;background:#17181a;color:#dcdcd6;font-family:system-ui,"Noto Sans Thai",sans-serif;padding:16px;max-width:560px;margin:auto;line-height:1.6}
h1{font-size:18px}
input[type=password],input[type=file]{display:block;width:100%;box-sizing:border-box;margin:6px 0 12px;min-height:44px;font-size:16px;padding:8px 10px;background:#111214;border:1px solid #4a4e55;color:inherit}
button{min-height:46px;padding:0 18px;font-size:15px;font-weight:600;background:#e6b422;color:#17181a;border:0}
#m{margin-top:12px;color:#8fd193}.e{color:#e5806f!important}
.k{color:#868a90;font-size:13px}
</style>
</head>
<body>
<h1>KTEC LOCK TOOL</h1>
<p class="k">เข้ารหัสไฟล์ index.html ด้วยรหัสผ่านของคุณ ทำงานในเบราว์เซอร์นี้ทั้งหมด ไฟล์และรหัสผ่านไม่ถูกส่งไปไหน ได้ไฟล์ index.html ตัวใหม่ที่เปิดดูไม่ได้ถ้าไม่มีรหัสผ่าน แล้วนำไปอัปโหลดทับบน GitHub</p>
<label>1. เลือกไฟล์ index.html ตัวจริง (ที่ยังไม่เข้ารหัส)</label>
<input type="file" id="f" accept=".html,text/html">
<label>2. ตั้งรหัสผ่าน (ยาวอย่างน้อย 12 ตัว ยิ่งยาวยิ่งดี)</label>
<input type="password" id="p1" autocomplete="new-password">
<label>3. พิมพ์รหัสผ่านซ้ำ</label>
<input type="password" id="p2" autocomplete="new-password">
<button id="b">เข้ารหัสและดาวน์โหลด</button>
<div id="m"></div>
<script>
var TPL="<!doctype html>\n<html lang=\"th\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<meta name=\"theme-color\" content=\"#17181a\">\n<title>KTEC<\/title>\n<link rel=\"manifest\" href=\"manifest.webmanifest\">\n<style>\nbody{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#17181a;color:#dcdcd6;font-family:system-ui,\"Noto Sans Thai\",sans-serif}\nform{width:min(92vw,340px)}\nh1{font-size:18px;margin:0 0 14px}\ninput[type=password]{width:100%;box-sizing:border-box;min-height:46px;font-size:16px;padding:0 12px;background:#111214;border:1px solid #4a4e55;color:inherit;border-radius:2px}\nbutton{margin-top:12px;width:100%;min-height:46px;font-size:15px;font-weight:600;background:#e6b422;color:#17181a;border:0;border-radius:2px}\nlabel{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}\n#m{min-height:1.5em;margin-top:10px;color:#e5806f;font-size:14px}\n<\/style>\n<\/head>\n<body>\n<form id=\"f\">\n<h1>KTEC ECU<\/h1>\n<input type=\"password\" id=\"p\" placeholder=\"รหัสผ่าน\" autocomplete=\"current-password\" autofocus>\n<label><input type=\"checkbox\" id=\"r\" checked> จำไว้ในเครื่องนี้<\/label>\n<button type=\"submit\">เข้าใช้งาน<\/button>\n<div id=\"m\"><\/div>\n<\/form>\n<script id=\"d\" type=\"application/json\">/*PAYLOAD*/<\/script>\n<script>\n(function(){\n\"use strict\";\nvar D=JSON.parse(document.getElementById(\"d\").textContent),te=new TextEncoder(),td=new TextDecoder(),K=\"ktec_k_\"+D.s.slice(0,10);\nfunction u8(b){var s=atob(b),a=new Uint8Array(s.length),i;for(i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}\nfunction b64(a){var s=\"\",i;for(i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}\nfunction msg(t){document.getElementById(\"m\").textContent=t}\nasync function unlock(key){\n var pt=await crypto.subtle.decrypt({name:\"AES-GCM\",iv:u8(D.i)},key,u8(D.c));\n var html=td.decode(pt);\n document.open();document.write(html);document.close()}\nasync function derive(pw){\n var km=await crypto.subtle.importKey(\"raw\",te.encode(pw),\"PBKDF2\",false,[\"deriveKey\"]);\n return crypto.subtle.deriveKey({name:\"PBKDF2\",salt:u8(D.s),iterations:D.n,hash:\"SHA-256\"},km,{name:\"AES-GCM\",length:256},true,[\"decrypt\"])}\nif(!(window.crypto&&crypto.subtle)){msg(\"ต้องเปิดผ่านลิงก์ https เท่านั้น\");return}\nif(/[?&]logout\\b/.test(location.search)){try{localStorage.removeItem(K)}catch(e){}msg(\"ออกจากระบบในเครื่องนี้แล้ว\")}\nelse{\n var saved=null;try{saved=localStorage.getItem(K)}catch(e){}\n if(saved){crypto.subtle.importKey(\"raw\",u8(saved),\"AES-GCM\",false,[\"decrypt\"]).then(unlock).catch(function(){try{localStorage.removeItem(K)}catch(e){}})}\n}\ndocument.getElementById(\"f\").addEventListener(\"submit\",async function(e){\n e.preventDefault();\n var pw=document.getElementById(\"p\").value;if(!pw)return;\n msg(\"กำลังตรวจรหัสผ่าน...\");\n try{\n  var key=await derive(pw);\n  await unlock(key);\n  if(document.getElementById(\"r\")&&document.getElementById(\"r\").checked){\n   var raw=await crypto.subtle.exportKey(\"raw\",key);try{localStorage.setItem(K,b64(new Uint8Array(raw)))}catch(x){}}\n }catch(err){msg(\"รหัสผ่านไม่ถูกต้อง\")}\n});\n})();\n<\/script>\n<\/body>\n<\/html>\n";
var IT=400000;
function b64(a){var s="",i;for(i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
async function enc(plain,pw){
 var te=new TextEncoder(),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 var km=await crypto.subtle.importKey("raw",te.encode(pw),"PBKDF2",false,["deriveKey"]);
 var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:IT,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt"]);
 var ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,te.encode(plain)));
 return TPL.replace("/*PAYLOAD*/",JSON.stringify({s:b64(salt),i:b64(iv),c:b64(ct),n:IT}))}
function say(t,bad){var m=document.getElementById("m");m.textContent=t;m.className=bad?"e":""}
document.getElementById("b").addEventListener("click",async function(){
 var f=document.getElementById("f").files[0],p1=document.getElementById("p1").value,p2=document.getElementById("p2").value;
 if(!(window.crypto&&crypto.subtle)){say("เบราว์เซอร์นี้ใช้ WebCrypto ไม่ได้ ลองเปิดไฟล์นี้ด้วย Chrome บนคอมพิวเตอร์",1);return}
 if(!f){say("ยังไม่ได้เลือกไฟล์",1);return}
 if(p1.length<12){say("รหัสผ่านสั้นเกินไป (อย่างน้อย 12 ตัว)",1);return}
 if(p1!==p2){say("รหัสผ่านสองช่องไม่ตรงกัน",1);return}
 var txt=await f.text();
 if(txt.indexOf("ktec_k_")>=0&&txt.indexOf("PBKDF2")>=0){say("ไฟล์นี้เข้ารหัสอยู่แล้ว ให้เลือกไฟล์ index.html ตัวจริงที่ยังไม่เข้ารหัส",1);return}
 say("กำลังเข้ารหัส...");
 try{
  var out=await enc(txt,p1);
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"text/html"}));a.download="index.html";
  document.body.appendChild(a);a.click();a.remove();
  say("เสร็จแล้ว ได้ไฟล์ index.html (เข้ารหัส) นำไปอัปโหลดทับบน GitHub จำรหัสผ่านไว้ให้ดี ลืมแล้วกู้ไม่ได้")
 }catch(e){say("ผิดพลาด: "+e.message,1)}
});
</script>
</body>
</html>
